name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run on main to release or retry
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Verify the CI run and obtain its exact commit
        id: commit
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py resolve "$CI_RUN_ID"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - name: Read the workspace version; never move an existing version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan

  binaries:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: rustup show
      - run: rustup target add '${{ matrix.target }}'
      - name: Build portable native CLI and HTTP server
        run: cargo build --locked --release -p pikarust-app --features server --bins --target '${{ matrix.target }}'
      - name: Package applications, licenses, and model instructions
        run: python scripts/release.py package --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-artifacts/
          if-no-files-found: error

  draft:
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-artifacts
      - name: Include the complete source tree and checksums
        run: python3 scripts/release.py source
      - name: Create or resume the draft at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release.py plan > "$RUNNER_TEMP/release-plan"
          if ! grep -qx 'build=true' "$RUNNER_TEMP/release-plan"; then
            echo 'The version has already been released or belongs to another commit.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/release-artifacts/* --clobber
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Development release of the PikaRust library sources, UCI engine, and HTTP server.

          NNUE weights are not bundled. See models/README.md, models/LICENSE-NNUE, and
          scripts/reference.lock in each application archive for the compatible model and terms.
          Complete sources and SHA-256 checksums accompany the binaries. Search parity
          and equal playing strength with official Pikafish are not established.

          Maintainers must resolve source-license provenance before publishing this
          draft or enabling registry distribution. Cargo registry publication is disabled.
          EOF
            gh release create "$RELEASE_TAG" target/release-artifacts/* \
              --target "$RELEASE_SHA" --title "$RELEASE_TAG" --draft \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
