name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a draft or publish after all artifacts are verified
        type: choice
        options: [draft, publish]
        default: draft
        required: true
      commit:
        description: Optional full main commit SHA; blank uses this dispatch's main commit
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Listing existing draft releases requires push access.
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the exact main commit and require its latest successful CI push
        id: commit
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py resolve --commit "$RELEASE_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          path: .release-source
          persist-credentials: false
      - name: Read the selected Cargo version and reject existing version conflicts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --root .release-source plan

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: .release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build with the selected source's toolchain and dependency lock
        working-directory: .release-source
        run: |
          rustup show
          rustup target add '${{ matrix.target }}'
          cargo build --locked --release -p pikarust-app --features server --bins --target '${{ matrix.target }}'
      - name: Package and verify applications, notices, and model instructions
        run: python scripts/release.py --root .release-source package --target '${{ matrix.target }}' --output target/release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: target/release-artifacts/
          if-no-files-found: error

  release:
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: .release-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-artifacts
      - name: Add the selected source archive and verify the complete artifact set
        run: |
          python3 scripts/release.py --root .release-source source --output target/release-artifacts
          python3 scripts/release.py --root .release-source verify --output target/release-artifacts
      - name: Create the immutable version tag and prepare or publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: python3 scripts/release.py --root .release-source finalize --sha "$RELEASE_SHA" --mode "$RELEASE_MODE" --output target/release-artifacts
