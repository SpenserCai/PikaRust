name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  frontend:
    name: Web browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pikarust-web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
          cache-dependency-path: pikarust-web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify NNUE and prepare the production web bundle
        working-directory: .
        run: |
          rustup show
          bash scripts/setup-pikafish.sh --verify-model
          bash scripts/build-web.sh
      - name: Install the locked Playwright Chromium browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the browser, native bridge, and NNUE engine together
        working-directory: .
        run: node scripts/check-web.mjs
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ github.sha }}
          path: target/e2e/web/
          if-no-files-found: warn
          retention-days: 30

  quality:
    name: Format, lint, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workspace and install pinned Rust
        run: |
          python3 scripts/check-release.py
          rustup show
          rustup component add rustfmt clippy
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Check validation and release tooling contracts
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all -- --check
      - name: Check portable AVX2 release code generation
        run: python3 scripts/check-avx2-codegen.py
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint on current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup show
      - name: Verify actual NNUE weights
        run: bash scripts/setup-pikafish.sh --verify-model
      - run: cargo test --locked --workspace --all-targets --features pikarust-app/server
      - run: cargo test --locked --workspace --doc
      - name: Scalar implementation
        run: cargo test --locked -p pikarust-core --no-default-features --features simd-none
      - name: SIMD safety with release optimizations
        run: cargo test --locked --release -p pikarust-core --lib nnue::simd
      - name: Search worker recovery with release optimizations
        run: cargo test --locked --release -p pikarust-core --lib search::thread::tests::recovered_worker_matches_canonical_initialization
      - name: Optional features compile
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Build and verify release archives without publishing
        run: |
          cargo build --locked --release -p pikarust-app --features server --bins --target '${{ matrix.target }}'
          python scripts/release.py package --target '${{ matrix.target }}' --output target/release-smoke
          python scripts/release.py source --output target/release-smoke
          python scripts/release.py verify --target '${{ matrix.target }}' --output target/release-smoke
      - name: Build the corresponding source offline with an empty Cargo cache
        if: matrix.os == 'ubuntu-24.04'
        run: |
          version=$(python scripts/check-release.py --field version)
          source_directory="$RUNNER_TEMP/pikarust-corresponding-source"
          mkdir -p "$source_directory"
          tar -xzf "target/release-smoke/pikarust-$version-source.tar.gz" -C "$source_directory"
          cd "$source_directory/pikarust-$version-source"
          CARGO_HOME="$RUNNER_TEMP/pikarust-offline-cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/pikarust-offline-target" \
            cargo build --offline --locked --release -p pikarust-app --features server --bins

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the declared MSRV with the committed dependency graph
        run: |
          msrv=$(python3 scripts/check-release.py --field msrv)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --workspace --all-targets --all-features

  alignment:
    name: Protocol and reference alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIKAFISH_OUTPUT_DIR: ${{ github.workspace }}/target/e2e/benchmark/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - run: rustup show
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - name: Compare the standard benchmark against the pinned official engine
        run: bash scripts/run-bench.sh compare --rounds 1 --depth 13 --hash 16 --output target/e2e/benchmark
      - name: UCI and cancellation behavior
        run: bash scripts/run-e2e.sh --suite smoke
        env:
          PIKARUST_E2E_REPORT: target/e2e/smoke.json
      - name: Build HTTP and WebSocket server
        run: cargo build --locked --release -p pikarust-app --features server --bin pikarust-server
      - name: HTTP and WebSocket lifecycle with real NNUE
        run: node scripts/check-server.mjs
      - name: Exact perft and NNUE alignment, plus search observations
        run: bash scripts/run-e2e.sh --suite alignment
        env:
          PIKARUST_E2E_REPORT: target/e2e/alignment.json
      - name: Preserve reports, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alignment-${{ github.sha }}
          path: |
            target/e2e/*.json
            target/e2e/*.log
            target/e2e/benchmark/*.json
            target/e2e/benchmark/*.log
            target/e2e/benchmark/candidate.patch
          if-no-files-found: warn
          retention-days: 30
